<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stacja Atmosferyczna ESP32</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; margin: 20px; }
        .chart-container { width: 90%; max-width: 800px; margin: 20px auto; background: #1e1e1e; padding: 20px; border-radius: 10px; }
    </style>
</head>
<body>
    <h2>Odczyty z czujnika ESP32 + BME280</h2>
    
    <div class="chart-container">
        <canvas id="tempChart"></canvas>
    </div>

    <script>
    const API_URL = 'https://aqi6g2dpxi.execute-api.eu-north-1.amazonaws.com/telemetry';

    async function fetchData() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();

            if (!data || data.length === 0) return;

            const labels = data.map(item => item.timestamp);
            
            // Mapowanie wartości z czujnika BME280 z tolerancją na nazwy pól
            const temps  = data.map(item => parseFloat(item.payload?.temperature ?? item.temperature));
            const hums   = data.map(item => parseFloat(item.payload?.humidity ?? item.humidity));
            const press  = data.map(item => parseFloat(item.payload?.pressure ?? item.pressure));

            updateChart(labels, temps, hums, press);
        } catch (err) {
            console.error("Błąd pobierania danych:", err);
        }
    }

    let chart;
    function updateChart(labels, temps, hums, press) {
        const ctx = document.getElementById('tempChart').getContext('2d');
        if (chart) chart.destroy();

        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Temperatura (°C)',
                        data: temps,
                        borderColor: '#ff4d4d',
                        backgroundColor: '#ff4d4d',
                        yAxisID: 'y',
                        tension: 0.2
                    },
                    {
                        label: 'Wilgotność (%)',
                        data: hums,
                        borderColor: '#4da6ff',
                        backgroundColor: '#4da6ff',
                        yAxisID: 'y',
                        tension: 0.2
                    },
                    {
                        label: 'Ciśnienie (hPa)',
                        data: press,
                        borderColor: '#4dff88',
                        backgroundColor: '#4dff88',
                        yAxisID: 'y1',
                        tension: 0.2
                    }
                ]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        ticks: { color: '#b0b0b0' },
                        grid: { color: '#333333' }
                    },
                    y: {
                        type: 'linear',
                        display: true,
                        position: 'left',
                        title: { display: true, text: 'Temp (°C) / Wilgotność (%)', color: '#fff' },
                        ticks: { color: '#b0b0b0' },
                        grid: { color: '#333333' }
                    },
                    y1: {
                        type: 'linear',
                        display: true,
                        position: 'right',
                        title: { display: true, text: 'Ciśnienie (hPa)', color: '#4dff88' },
                        ticks: { color: '#4dff88' },
                        grid: { drawOnChartArea: false } // Zapobiega nakładaniu się siatek obu osi
                    }
                },
                plugins: {
                    legend: {
                        labels: { color: '#ffffff' }
                    }
                }
            }
        });
    }

    fetchData();
    setInterval(fetchData, 10000); // Odświeżanie co 10 sekund
</script>
</body>
</html>
